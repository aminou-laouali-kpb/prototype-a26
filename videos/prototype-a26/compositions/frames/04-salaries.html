  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const DURATION = 13.419;
      const SCROLL_AT = 1.17;
      const SCROLL_DUR = 3.28;
      const SCROLL_DISTANCE = 136;
      const ATTACK_DUR = 0.16;
      const RELEASE = 0.34;
      const REST_LEVEL = 0.16;
      const MAX_BLUR = 34;
      const MAX_SCALE_BOOST = 0.06;

      const TIMINGS = {
        matricules: { start: 1.396, end: 2.052 },
        postes: { start: 2.109, end: 2.6 },
        services: { start: 2.643, end: 3.217 },
        salaires: { start: 3.266, end: 4.121 },
        paiement: { start: 4.157, end: 5.514 },
      };

      const LABEL_ORDER = ["matricules", "postes", "services", "salaires", "paiement"];

      const stage = document.getElementById("f-04-salaries-stage");
      const win = document.getElementById("f-04-salaries-window");
      const accent = document.getElementById("f-04-salaries-accent");
      const surface = document.getElementById("f-04-salaries-surface");
      const pill = document.getElementById("f-04-salaries-pill");
      const glowEls = stage.querySelectorAll("[data-hf='glow']");
      const labelEls = stage.querySelectorAll("[data-hf='label']");

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        const releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }

      const tl = gsap.timeline({ paused: true });

      gsap.set(win, { x: -1180 });
      gsap.set(accent, { scale: 0.86, opacity: 0 });
      gsap.set(pill, { scale: 0, opacity: 0 });
      gsap.set(labelEls, { y: 18, opacity: 0 });

      tl.fromTo(
        win,
        { x: -1180 },
        { x: 0, duration: 1.12, ease: "power3.out" },
        0,
      );

      tl.fromTo(
        accent,
        { scale: 0.86, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.92, ease: "power3.out" },
        0.04,
      );

      tl.to(
        surface,
        { y: -SCROLL_DISTANCE, duration: SCROLL_DUR, ease: "power3.out" },
        SCROLL_AT,
      );

      LABEL_ORDER.forEach((key, i) => {
        const el = stage.querySelector("[data-hf='label'][data-word='" + key + "']");
        const at = TIMINGS[key].start;
        if (i > 0) {
          const prev = stage.querySelector(
            "[data-hf='label'][data-word='" + LABEL_ORDER[i - 1] + "']",
          );
          tl.to(prev, { y: -16, opacity: 0, duration: 0.18, ease: "power2.in" }, at);
        }
        tl.fromTo(
          el,
          { y: 16, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.26, ease: "power3.out" },
          at + 0.03,
        );
      });

      const glowDriver = { t: 0 };
      tl.to(
        glowDriver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            const time = glowDriver.t;
            glowEls.forEach(function (el) {
              const timing = TIMINGS[el.getAttribute("data-word")];
              if (!timing) return;
              const env = envelope(time, timing.start, timing.end);
              el.style.opacity = String(env);
              el.style.background = "rgba(2, 132, 199, " + (0.12 + 0.26 * env) + ")";
              el.style.boxShadow = "0 0 " + MAX_BLUR * env + "px rgba(2, 132, 199, " + 0.5 * env + ")";
              el.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env) + ")";
            });
          },
        },
        0,
      );

      tl.fromTo(
        pill,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        5.582,
      );

      const idleStart = 6.18;
      const idleDur = DURATION - idleStart;
      const cycles = idleDur / 2.45;
      const jitter = { p: 0 };
      tl.to(
        jitter,
        {
          p: Math.PI * 2 * cycles,
          duration: idleDur,
          ease: "none",
          onUpdate: function () {
            const t = jitter.p / (Math.PI * 2 * cycles);
            const fade = t < 0.8 ? 1 : (1 - t) / 0.2;
            gsap.set(pill, { y: Math.sin(jitter.p) * 2.2 * fade });
          },
        },
        idleStart,
      );

      window.__timelines["04-salaries"] = tl;
    })();
  </script>
