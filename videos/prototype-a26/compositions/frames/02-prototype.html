  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const DURATION = 13.438;
      const el = (id) => document.getElementById(id);

      const windowEl = el("f-02-prototype-window");
      const accent = el("f-02-prototype-accent");
      const headlines = el("f-02-prototype-headlines");
      const pills = el("f-02-prototype-pills");
      const lineTemps = el("f-02-prototype-line-temps");
      const lineRh = el("f-02-prototype-line-rh");
      const linePrepaie = el("f-02-prototype-line-prepaie");
      const pillVerifiable = el("f-02-prototype-pill-verifiable");
      const chip = el("f-02-prototype-chip");
      const chipLabel = el("f-02-prototype-chip-label");
      const glowTemps = el("f-02-prototype-glow-temps");
      const glowRh = el("f-02-prototype-glow-rh");
      const glowPrepaie = el("f-02-prototype-glow-prepaie");

      const tl = gsap.timeline({ paused: true });

      gsap.set(windowEl, { rotateY: -4, rotateX: 1.6, force3D: true });
      gsap.set(accent, { scale: 0, opacity: 0 });
      gsap.set([lineTemps, lineRh, linePrepaie], { opacity: 0, y: 18 });
      gsap.set(headlines, { scale: 1, opacity: 1 });
      gsap.set(pills, { scale: 0.72, opacity: 0 });
      gsap.set(pillVerifiable, { opacity: 0, y: 12 });
      gsap.set(chip, { scale: 0, opacity: 0 });
      gsap.set([glowTemps, glowRh, glowPrepaie], { opacity: 0 });

      tl.fromTo(
        windowEl,
        { x: 460, opacity: 0.28 },
        { x: 0, opacity: 1, duration: 1.2, ease: "power3.out" },
        0,
      );

      tl.fromTo(
        accent,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.62, ease: "power3.out" },
        0.12,
      );

      tl.fromTo(
        lineTemps,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" },
        1.45,
      );

      tl.fromTo(
        lineTemps,
        { opacity: 1, y: 0 },
        { opacity: 0, y: -18, duration: 0.32, ease: "power2.in" },
        1.876,
      );
      tl.fromTo(
        lineRh,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        1.876,
      );

      tl.fromTo(
        lineRh,
        { opacity: 1, y: 0 },
        { opacity: 0, y: -18, duration: 0.32, ease: "power2.in" },
        3.059,
      );
      tl.fromTo(
        linePrepaie,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        3.059,
      );

      const SWAP_AT = 4.1;
      const EXIT_DUR = 0.4;
      const ENTER_DUR = 0.55;
      const OVERLAP = 0.15;

      tl.to(
        headlines,
        { scale: 0.72, opacity: 0, duration: EXIT_DUR, ease: "power2.in" },
        SWAP_AT,
      );
      tl.to(
        pills,
        { scale: 1, opacity: 1, duration: ENTER_DUR, ease: "back.out(1.4)" },
        SWAP_AT + EXIT_DUR - OVERLAP,
      );
      tl.fromTo(
        pillVerifiable,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        4.833,
      );

      tl.to(
        pills,
        { scale: 0.72, opacity: 0, duration: 0.4, ease: "power2.in" },
        6.27,
      );

      tl.fromTo(
        chip,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        7.32,
      );

      const ATTACK_DUR = 0.16;
      const RELEASE = 0.35;
      const REST_LEVEL = 0.16;
      const GLOWS = [
        { el: glowTemps, start: 0.905, end: 1.705 },
        { el: glowRh, start: 1.876, end: 2.842 },
        { el: glowPrepaie, start: 3.059, end: 3.797 },
      ];

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        const releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }

      const glowDriver = { t: 0 };
      tl.to(
        glowDriver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: () => {
            const t = glowDriver.t;
            const fade = t < 4.1 ? 1 : Math.max(0, 1 - (t - 4.1) / 0.35);
            GLOWS.forEach((item) => {
              const env = envelope(t, item.start, item.end);
              item.el.style.opacity = String((0.18 + 0.72 * env) * fade);
              item.el.style.boxShadow = `0 0 ${28 * env}px rgba(2, 132, 199, ${0.55 * env * fade})`;
              item.el.style.borderColor = `rgba(2, 132, 199, ${0.2 + 0.55 * env})`;
            });

            if (t >= 7.409) {
              const env = envelope(t, 7.409, 8.284);
              chipLabel.style.textShadow = `0 0 ${22 * env}px rgba(248, 250, 252, ${0.45 * env})`;
            }
          },
        },
        0,
      );

      const IDLE_START = 8.0;
      const IDLE_DUR = DURATION - IDLE_START;
      const CYCLES = 2.3;
      const phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: () => {
            const s = Math.sin(phase.p);
            const u = phase.p / (Math.PI * 2 * CYCLES);
            const env = u < 0.8 ? 1 : (1 - u) / 0.2;
            gsap.set(chip, { y: s * 2.4 * env, rotation: s * 0.35 * env });
          },
        },
        IDLE_START,
      );

      tl.seek(0);
      window.__timelines["02-prototype"] = tl;
    })();
  </script>
