  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const DURATION = 10.564;
      const root = document.querySelector('[data-composition-id="01-accroche"]');
      const el = (id) => root.querySelector('[id="' + id + '"]');

      const plate = el("f-01-accroche-plate");
      const stem = el("f-01-accroche-stem");
      const stemRule = el("f-01-accroche-stem-rule");
      const slot = el("f-01-accroche-slot");
      const slotRule = el("f-01-accroche-slot-rule");
      const slam1 = el("f-01-accroche-slam-1-word");
      const slam2 = el("f-01-accroche-slam-2-word");
      const slam3 = el("f-01-accroche-slam-3-word");
      const la = el("f-01-accroche-la");
      const hold = el("f-01-accroche-hold");
      const box = el("f-01-accroche-box");

      const SEQUENCE = [
        { t: 0, text: "" },
        { t: 1.22, text: "le temps" },
        { t: 1.81, text: "les RH" },
        { t: 2.4, text: "la paie" },
      ];

      function textAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(plate, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0);

      tl.fromTo(
        stem,
        { opacity: 0, scale: 1.06 },
        { opacity: 1, scale: 1, duration: 0.1, ease: "none" },
        0,
      );

      tl.fromTo(
        stemRule,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        0.18,
      );
      tl.set(stemRule, { scaleX: 0 }, 1.22);
      tl.set(slotRule, { scaleX: 0 }, 0);

      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            const next = textAt(driver.t);
            if (slot.textContent !== next) slot.textContent = next;
          },
        },
        0,
      );

      [1.22, 1.81, 2.4].forEach(function (t) {
        tl.fromTo(
          slotRule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.42, ease: "power2.out", immediateRender: false },
          t,
        );
      });

      const BEATS = [3.0, 3.52, 4.04];

      tl.fromTo(
        slam1,
        { scale: 1.4, filter: "blur(10px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.42, ease: "power4.out" },
        BEATS[0],
      );

      tl.fromTo(
        slam2,
        { x: -280, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" },
        BEATS[1],
      );

      tl.fromTo(
        slam3,
        { y: 64, rotation: 5, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.44, ease: "circ.out" },
        BEATS[2],
      );

      tl.set(la, { opacity: 0 }, 4.56);

      tl.fromTo(
        box,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.56,
      );

      const idleStart = 5.06;
      const idleDur = DURATION - idleStart;
      const cycles = idleDur / 3.4;
      const phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * cycles,
          duration: idleDur,
          ease: "none",
          onUpdate: function () {
            const u = phase.p / (Math.PI * 2 * cycles);
            const env = u < 0.8 ? 1 : (1 - u) / 0.2;
            hold.style.transform = "translateY(" + Math.sin(phase.p) * 1.5 * env + "px)";
          },
        },
        idleStart,
      );

      window.__timelines["01-accroche"] = tl;
    })();
  </script>
