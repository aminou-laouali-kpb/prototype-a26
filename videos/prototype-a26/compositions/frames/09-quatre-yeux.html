      const DURATION = 14.236;
      const CLIP_HIDDEN = "polygon(-40% 140%, -10% 170%, -20% 180%, -50% 150%)";
      const CLIP_SHOWN = "polygon(-40% 140%, 140% -40%, 170% -10%, -10% 170%)";
      const root = document.querySelector('[data-composition-id="09-quatre-yeux"]');

      const screen = el("f-09-quatre-yeux-payroll-screen");

      const lineB = el("f-09-quatre-yeux-line-b");

      gsap.set(screen, {
        x: 960,
        y: 486,
        xPercent: -50,
        yPercent: -50,
        scale: 0.88,
        opacity: 1,
        transformOrigin: "50% 50%",
      });

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        veil,
        { clipPath: CLIP_HIDDEN },
        { clipPath: CLIP_SHOWN, duration: 1.14, ease: "power2.inOut" },
        1.14
      );

      tl.fromTo(
        pill,
        { x: -420, y: 920, rotation: -36 },
        { x: 1960, y: -220, rotation: -36, duration: 1.14, ease: "power2.inOut" },
        1.14
      );

      tl.fromTo(
        card,
        { opacity: 0, y: 28, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.72, ease: "power2.out" },
        1.38

      tl.fromTo(
        lineA,
        { opacity: 1, y: 0 },
        { opacity: 0, y: -22, duration: 0.62, ease: "power2.inOut" },
        3.1

      tl.fromTo(
        lineB,
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.62, ease: "power2.inOut" },
        3.1
      );

      const clock = { t: 0 };
      const idleStart = 3.88;
      const idleDur = DURATION - idleStart;
      const period = 3.6;
      tl.to(
        clock,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            const t = clock.t;
            if (t <= idleStart) {
              gsap.set(idle, { y: 0 });

            gsap.set(idle, { y: s * 2 * env });
          },
        },
        0
      );
