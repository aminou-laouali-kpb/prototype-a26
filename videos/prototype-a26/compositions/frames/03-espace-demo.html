  <script>
    (function () {
      const DUR = 18.233;
      const byId = (id) => document.getElementById(id);

      const outer = byId("f-03-espace-demo-zoom-outer");
      const inner = byId("f-03-espace-demo-zoom-inner");
      const plate = byId("f-03-espace-demo-plate");
      const shot = byId("f-03-espace-demo-shot");
      const dim = byId("f-03-espace-demo-dim");
      const title = byId("f-03-espace-demo-title");
      const accent = byId("f-03-espace-demo-accent");
      const word1 = byId("f-03-espace-demo-word-1");
      const word2 = byId("f-03-espace-demo-word-2");
      const stat10 = byId("f-03-espace-demo-stat-10");
      const ringFill = byId("f-03-espace-demo-ring-fill");
      const count10 = byId("f-03-espace-demo-count-10");
      const label10 = byId("f-03-espace-demo-label-10");
      const statMasse = byId("f-03-espace-demo-stat-masse");
      const glow = byId("f-03-espace-demo-glow");
      const countMasse = byId("f-03-espace-demo-count-masse");
      const labelMasse = byId("f-03-espace-demo-label-masse");
      const pill = byId("f-03-espace-demo-demo-pill");

      gsap.set(plate, {
        rotationX: 6,
        rotationY: -8,
        scale: 1.1,
        transformOrigin: "50% 50%",
      });

      const ringLen = ringFill.getTotalLength() || 2 * Math.PI * 88;
      ringFill.style.strokeDasharray = String(ringLen);
      ringFill.style.strokeDashoffset = String(ringLen);
      ringFill.style.transformBox = "fill-box";
      gsap.set(ringFill, {
        rotation: -90,
        transformOrigin: "50% 50%",
      });

      gsap.set(accent, { scaleX: 0 });
      gsap.set([word1, word2], { opacity: 0 });
      gsap.set(stat10, { opacity: 0, scale: 1, filter: "blur(0px)" });
      gsap.set(label10, { opacity: 0, y: 12 });
      gsap.set(statMasse, { opacity: 0, scale: 1, filter: "blur(0px)" });
      gsap.set(labelMasse, { opacity: 0, y: 12 });
      gsap.set(glow, { opacity: 0, scale: 0.84 });
      gsap.set(pill, { opacity: 0, scale: 0, y: 10 });

      const MASSE_TX = -(1413.5 - 960);
      const MASSE_TY = -(225.5 - 540);

      const cam = { scale: 1.02, x: 18, y: 12, p: 0 };
      const applyCamera = () => {
        const dx = Math.sin(cam.p) * 5;
        const dy = Math.sin(cam.p * 1.32) * 2.4;
        outer.style.transform = "scale(" + cam.scale + ")";
        inner.style.transform = "translate(" + (cam.x + dx) + "px, " + (cam.y + dy) + "px)";
      };
      applyCamera();

      const frNum = (n) =>
        Math.round(n)
          .toLocaleString("fr-FR")
          .replace(/\u202f/g, " ")
          .replace(/\u00a0/g, " ");

      const tl = gsap.timeline({ paused: true });

      tl.to(
        cam,
        {
          p: Math.PI * 2 * 2,
          duration: DUR,
          ease: "none",
          onUpdate: applyCamera,
        },
        0,
      );

      tl.to(
        cam,
        { scale: 1.1, x: 56, y: 34, duration: 2.25, ease: "power2.out", onUpdate: applyCamera },
        0,
      );
      tl.to(
        cam,
        { scale: 1.18, x: 52, y: 30, duration: 2.66, ease: "power1.inOut", onUpdate: applyCamera },
        2.25,
      );
      tl.to(
        cam,
        {
          scale: 1.72,
          x: MASSE_TX,
          y: MASSE_TY,
          duration: 2.55,
          ease: "power3.inOut",
          onUpdate: applyCamera,
        },
        4.91,
      );
      tl.to(
        cam,
        { scale: 1.12, x: -120, y: 72, duration: 2.5, ease: "power2.inOut", onUpdate: applyCamera },
        8.57,
      );

      tl.fromTo(
        shot,
        { opacity: 0.78 },
        { opacity: 1, duration: 0.45, ease: "power1.out" },
        0,
      );
      tl.fromTo(dim, { opacity: 1 }, { opacity: 0.45, duration: 2.2, ease: "power1.out" }, 0);
      tl.to(dim, { opacity: 0.28, duration: 2.4, ease: "power1.inOut" }, 4.91);
      tl.to(dim, { opacity: 0.18, duration: 2.2, ease: "power1.out" }, 8.57);

      tl.fromTo(
        accent,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.42, ease: "power2.out", immediateRender: false },
        1.28,
      );
      tl.fromTo(
        word1,
        { opacity: 0, scale: 1.38, filter: "blur(10px)" },
        {
          opacity: 1,
          scale: 1,
          filter: "blur(0px)",
          duration: 0.5,
          ease: "power4.out",
          immediateRender: false,
        },
        1.48,
      );
      tl.fromTo(
        word2,
        { opacity: 0, y: 56 },
        { opacity: 1, y: 0, duration: 0.5, ease: "circ.out", immediateRender: false },
        2.05,
      );

      tl.to(title, { scale: 1.2, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 2.72);
      tl.to(title, { opacity: 0.15, duration: 0.2, ease: "none" }, 2.72);
      tl.set(title, { opacity: 0 }, 2.92);

      tl.fromTo(
        stat10,
        { opacity: 0.15, scale: 0.75, filter: "blur(10px)" },
        {
          opacity: 1,
          scale: 1,
          filter: "blur(0px)",
          duration: 0.5,
          ease: "expo.out",
          immediateRender: false,
        },
        2.92,
      );

      const ten = { value: 0 };
      tl.to(
        ten,
        {
          value: 10,
          duration: 1.28,
          ease: "power3.out",
          onUpdate: () => {
            count10.textContent = String(Math.round(ten.value));
          },
        },
        2.98,
      );
      tl.fromTo(
        count10,
        { scale: 0.5 },
        { scale: 1, duration: 1.28, ease: "power3.out", immediateRender: false },
        2.98,
      );
      tl.fromTo(
        ringFill,
        { strokeDashoffset: ringLen },
        { strokeDashoffset: 0, duration: 1.28, ease: "power3.out", immediateRender: false },
        2.98,
      );
      tl.fromTo(
        label10,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.48, ease: "power2.out", immediateRender: false },
        3.05,
      );

      tl.to(stat10, { scale: 1.2, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 4.85);
      tl.to(stat10, { opacity: 0.15, duration: 0.2, ease: "none" }, 4.85);
      tl.set(stat10, { opacity: 0 }, 5.05);

      tl.fromTo(
        statMasse,
        { opacity: 0.15, scale: 0.75, filter: "blur(10px)" },
        {
          opacity: 1,
          scale: 1,
          filter: "blur(0px)",
          duration: 0.5,
          ease: "expo.out",
          immediateRender: false,
        },
        5.05,
      );

      const GLOW_PEAK = 0.28;
      tl.fromTo(
        glow,
        { opacity: 0, scale: 0.84 },
        { opacity: GLOW_PEAK, scale: 1, duration: 1.15, ease: "power2.out", immediateRender: false },
        6.4,
      );
      const glowPhase = { p: 0 };
      tl.to(
        glowPhase,
        {
          p: Math.PI * 2 * 3,
          duration: 10.4,
          ease: "none",
          onUpdate: () => {
            const s = Math.sin(glowPhase.p);
            glow.style.opacity = String(GLOW_PEAK + s * 0.04);
            glow.style.transform = "scale(" + (1 + s * 0.02) + ")";
          },
        },
        7.55,
      );

      const masse = { value: 0 };
      tl.to(
        masse,
        {
          value: 2814933,
          duration: 2.05,
          ease: "power3.out",
          onUpdate: () => {
            countMasse.textContent = frNum(masse.value);
          },
        },
        5.5,
      );
      tl.fromTo(
        countMasse,
        { scale: 0.55 },
        { scale: 1, duration: 2.05, ease: "power3.out", immediateRender: false },
        5.5,
      );
      tl.fromTo(
        labelMasse,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out", immediateRender: false },
        5.62,
      );

      tl.fromTo(
        pill,
        { opacity: 0, scale: 0, y: 10 },
        {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.55,
          ease: "power3.out",
          immediateRender: false,
        },
        8.57,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["03-espace-demo"] = tl;
    })();
  </script>
