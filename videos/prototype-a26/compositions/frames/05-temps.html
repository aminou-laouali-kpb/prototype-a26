      id="f-05-temps-scene"
      class="clip"

    >

        <div id="f-05-temps-chip-corrections" class="f-05-temps-chip">Corrections justifiées</div>
        <div id="f-05-temps-pill-session">Session conservée</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const W = 1920;
      const H = 1080;
      const S0 = 6.15;
      const KEEP_OUT = 890;
      const ZOOM_AT = 4.22;
      const ZOOM_DUR = 1.17;

      const world = document.getElementById("f-05-temps-world");
      const plate = document.getElementById("f-05-temps-plate");
      const target = document.getElementById("f-05-temps-target");
      const chipArrivees = document.getElementById("f-05-temps-chip-arrivees");
      const chipSorties = document.getElementById("f-05-temps-chip-sorties");
      const chipCorrections = document.getElementById("f-05-temps-chip-corrections");
      const pillSession = document.getElementById("f-05-temps-pill-session");

      const cx = target.offsetLeft + target.offsetWidth / 2;
      const cy = target.offsetTop + target.offsetHeight / 2;
      const cardBottom = target.offsetTop + target.offsetHeight;
      let aimX = cx;
      let aimY = cy;
      const bottomAt = (ay) => S0 * (cardBottom - ay) + H / 2;
      if (bottomAt(aimY) > KEEP_OUT) {
        aimY = cardBottom - (KEEP_OUT - H / 2) / S0;
      }
      const offsetX = aimX - W / 2;
      const offsetY = aimY - H / 2;
      const startX = -offsetX * S0;
      const startY = -offsetY * S0;

      const cam = { scale: S0, x: startX, y: startY };
      function applyCamera() {
        world.style.transform = "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.scale + ")";
      }
      applyCamera();

      const tl = gsap.timeline({ paused: true, onUpdate: applyCamera });

      tl.to(cam, { scale: S0, x: startX, y: startY, duration: ZOOM_AT, ease: "none" }, 0);
      tl.to(cam, { scale: 1, x: 0, y: 0, duration: ZOOM_DUR, ease: "expo.out" }, ZOOM_AT);

      tl.fromTo(
        plate,
        { filter: "brightness(0.86)" },
        { filter: "brightness(0.86)", duration: ZOOM_AT, ease: "none" },
        0,
      );
      tl.to(plate, { filter: "brightness(1)", duration: ZOOM_DUR, ease: "expo.out" }, ZOOM_AT);

      tl.fromTo(
        target,
        { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.1,
      );

      tl.fromTo(
        chipArrivees,
        { scale: 0, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.85,
      );
      tl.fromTo(
        chipSorties,
        { scale: 0, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.48,
      );
      tl.fromTo(
        chipCorrections,
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        3.6,
      );

      tl.fromTo(
        pillSession,
        { scale: 0, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        5.79,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["05-temps"] = tl;
    })();
  </script>
