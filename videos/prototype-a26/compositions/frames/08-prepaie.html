  <script>
    (function () {
      const DURATION = 20.852;
      const byId = (id) => document.getElementById(id);

      const screen = byId("f-08-prepaie-payroll-screen");
      const inner = byId("f-08-prepaie-zoom-inner");
      const dim = byId("f-08-prepaie-dim");
      const words = byId("f-08-prepaie-words");
      const wordSep = byId("f-08-prepaie-word-septembre");
      const wordCalc = byId("f-08-prepaie-word-calculee");
      const brutCard = byId("f-08-prepaie-brut-card");

      const brutFill = byId("f-08-prepaie-brut-fill");
      const brutLabel = byId("f-08-prepaie-brut-label");
      const chipCotis = byId("f-08-prepaie-chip-cotis");
      const chipIts = byId("f-08-prepaie-chip-its");
      const netHero = byId("f-08-prepaie-net-hero");
      const netGlow = byId("f-08-prepaie-net-glow");
      const netNum = byId("f-08-prepaie-net-num");
      const netLabel = byId("f-08-prepaie-net-label");
      const sim = byId("f-08-prepaie-sim");

      const frNum = (n) =>
        Math.round(n)
          .toLocaleString("fr-FR")
          .replace(/\u202f/g, " ")
          .replace(/\u00a0/g, " ");

      gsap.set(screen, { x: 0, y: 54, scale: 1, opacity: 1, transformOrigin: "50% 50%" });
      gsap.set(inner, { x: 0, y: 0 });
      gsap.set(dim, { opacity: 0.15 });
      gsap.set([wordSep, wordCalc], { opacity: 0 });
      gsap.set(words, { opacity: 1, scale: 1, filter: "blur(0px)" });
      gsap.set(brutCard, { opacity: 0, scale: 1, filter: "blur(0px)" });
      gsap.set(brutFill, { scaleX: 0 });
      gsap.set(brutLabel, { opacity: 0, y: 12 });
      gsap.set([chipCotis, chipIts], { opacity: 0, scale: 0, y: 10 });
      gsap.set(netHero, { opacity: 0, scale: 1, filter: "blur(0px)" });
      gsap.set(netGlow, { opacity: 0, scale: 0.84 });
      gsap.set(netLabel, { opacity: 0, y: 12 });
      gsap.set(sim, { opacity: 0, scale: 0, y: 10 });

      const ZOOM_SCALE = 1.62;
      const innerX = -(1089.5 - 960);
      const innerY = -(285 - 540);

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        screen,
        { x: 0, y: 54, scale: 1, opacity: 1 },
        { x: 0, y: 54, scale: 1.05, opacity: 1, duration: 6.14, ease: "none" },
        0,
      );

      tl.fromTo(
        screen,
        { scale: 1.05, x: 0, y: 54, opacity: 1 },
        {
          scale: ZOOM_SCALE,
          x: 0,
          y: 54,
          opacity: 1,
          duration: 1.85,
          ease: "power3.inOut",
          immediateRender: false,
        },
        6.14,
      );
      tl.fromTo(
        inner,
        { x: 0, y: 0 },
        { x: innerX, y: innerY, duration: 1.85, ease: "power3.inOut", immediateRender: false },
        6.14,
      );

      tl.fromTo(
        screen,
        { scale: ZOOM_SCALE, x: 0, y: 54, opacity: 1 },
        {
          scale: 0.88,
          x: 0,
          y: 0,
          opacity: 1,
          duration: 2.35,
          ease: "power2.inOut",
          immediateRender: false,
        },
        9.85,
      );
      tl.fromTo(
        inner,
        { x: innerX, y: innerY },
        { x: 0, y: 0, duration: 2.35, ease: "power2.inOut", immediateRender: false },
        9.85,
      );

      tl.fromTo(
        wordSep,
        { scale: 1.5, filter: "blur(10px)", opacity: 0 },
        {
          scale: 1,
          filter: "blur(0px)",
          opacity: 1,
          duration: 0.5,
          ease: "power4.out",
          immediateRender: false,
        },
        0.4,
      );
      tl.fromTo(
        wordCalc,
        { y: 72, rotation: 5, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "circ.out", immediateRender: false },
        1.7,
      );

      tl.to(words, { scale: 1.2, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 2.43);
      tl.to(words, { opacity: 0.15, duration: 0.2, ease: "none" }, 2.43);
      tl.set(words, { opacity: 0 }, 2.63);

      tl.fromTo(
        brutCard,
        { opacity: 0.15, scale: 0.75, filter: "blur(10px)" },
        {
          opacity: 1,
          scale: 1,
          filter: "blur(0px)",
          duration: 0.5,
          ease: "expo.out",
          immediateRender: false,
        },
        2.53,
      );

      const brut = { value: 0 };
      tl.to(
        brut,
        {
          value: 1598214,
          duration: 2.4,
          ease: "power3.out",
          onUpdate: function () {
            brutNum.textContent = frNum(brut.value);
          },
        },
        2.55,
      );
      tl.fromTo(
        brutNum,
        { scale: 0.5 },
        { scale: 1, duration: 2.4, ease: "power3.out", immediateRender: false },
        2.55,
      );
      tl.fromTo(
        brutFill,
        { scaleX: 0 },
        { scaleX: 1, duration: 2.4, ease: "power3.out", immediateRender: false },
        2.55,
      );
      tl.fromTo(
        brutLabel,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", immediateRender: false },
        2.62,
      );

      tl.fromTo(
        chipCotis,
        { scale: 0, opacity: 0, y: 10 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false },
        5.2,
      );
      tl.fromTo(
        chipIts,
        { scale: 0, opacity: 0, y: 10 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false },
        6.12,
      );

      tl.to(brutCard, { scale: 0.8, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 6.55);
      tl.to(brutCard, { opacity: 0.15, duration: 0.2, ease: "none" }, 6.55);
      tl.set(brutCard, { opacity: 0 }, 6.75);

      tl.fromTo(
        netHero,
        { opacity: 0.15, scale: 1.25, filter: "blur(10px)" },
        {
          opacity: 1,
          scale: 1,
          filter: "blur(0px)",
          duration: 0.5,
          ease: "expo.out",
          immediateRender: false,
        },
        6.75,
      );

      const GLOW_PEAK = 0.28;
      tl.fromTo(
        netGlow,
        { opacity: 0, scale: 0.84 },
        { opacity: GLOW_PEAK, scale: 1, duration: 1.2, ease: "power2.out", immediateRender: false },
        7.48,
      );

      const net = { value: 0 };
      tl.to(
        net,
        {
          value: 1409258,
          duration: 1.55,
          ease: "power3.out",
          onUpdate: function () {
            netNum.textContent = frNum(net.value);
          },
        },
        7.48,
      );
      tl.fromTo(
        netNum,
        { scale: 0.5 },
        { scale: 1, duration: 1.55, ease: "power3.out", immediateRender: false },
        7.48,
      );
      tl.fromTo(
        netLabel,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", immediateRender: false },
        6.82,
      );

      const bloomEnd = 8.68;
      const breatheDur = DURATION - bloomEnd;
      const glowPhase = { p: 0 };
      tl.to(
        glowPhase,
        {
          p: Math.PI * 2 * (breatheDur / 3.2),
          duration: breatheDur,
          ease: "none",
          onUpdate: function () {
            const s = Math.sin(glowPhase.p);
            netGlow.style.opacity = String(GLOW_PEAK + s * 0.04);
            netGlow.style.transform = "scale(" + (1 + s * 0.02) + ")";
          },
        },
        bloomEnd,
      );

      tl.fromTo(
        sim,
        { opacity: 0, scale: 0, y: 10 },
        {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.55,
          ease: "power3.out",
          immediateRender: false,
        },
        11.8,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["08-prepaie"] = tl;
    })();
  </script>
