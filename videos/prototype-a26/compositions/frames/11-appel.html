          <div class="f-11-appel-line-inner" id="f-11-appel-line-1-inner">

  <script>
    (function () {
      const DURATION = 16.143;
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });

      const line1 = $("f-11-appel-line-1");
      const line2 = $("f-11-appel-line-2");
      const line2Inner = $("f-11-appel-line-2-inner");
      const cluster = $("f-11-appel-cluster");
      const pillWrap = $("f-11-appel-pill-wrap");
      const glow = $("f-11-appel-glow");
      const wordmark = $("f-11-appel-wordmark");
      const rings = [$("f-11-appel-ring-a"), $("f-11-appel-ring-b"), $("f-11-appel-ring-c")];

      const PULSE = 0.38;
      const BEATS = [PULSE * 0.26, PULSE * 1.26, PULSE * 2.26, PULSE * 3.26];
      const CUT_AT = 3.633;
      const CLEAR_AT = 5.2;
      const PILL_AT = 5.36;
      const LOCKUP_AT = 7.45;
      const IDLE_START = 8.7;
      const IDLE_DUR = 5.4;
      const SETTLE_AT = 14.35;
      const WORD_CUTS = [
        { t: 3.633, el: $("f-11-appel-w-du") },
        { t: 3.733, el: $("f-11-appel-w-pointage") },
        { t: 4.13, el: $("f-11-appel-w-au") },
        { t: 4.229, el: $("f-11-appel-w-bulletin") },
      ];

      const SEQUENCE = [
        { t: 0, line: 1 },
        { t: CUT_AT, line: 2 },
      ];

      function lineAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].line;
        }
        return 1;
      }

      gsap.set(line2, { opacity: 0 });
      gsap.set(line2Inner, { scale: 1, opacity: 1 });
      gsap.set(
        WORD_CUTS.map((w) => w.el),
        { opacity: 0 }
      );
      gsap.set(cluster, { opacity: 1 });

      tl.fromTo(
        $("f-11-appel-w-une"),
        { scale: 1.48, filter: "blur(12px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.48, ease: "power4.out" },
        BEATS[0]
      );
      tl.fromTo(
        $("f-11-appel-w-source"),
        { x: -220, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.42, ease: "expo.out" },
        BEATS[1]
      );
      tl.fromTo(
        $("f-11-appel-w-de"),
        { y: 54, rotation: 5, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "circ.out" },
        BEATS[2]
      );
      tl.fromTo(
        $("f-11-appel-w-verite"),
        { y: 22, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.46, ease: "power3.out" },
        BEATS[3]
      );
      tl.fromTo(
        $("f-11-appel-mark-1"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.38, ease: "power2.out" },
        BEATS[3] + 0.22
      );

      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: () => {
            const show = lineAt(driver.t);
            line1.style.opacity = show === 1 ? "1" : "0";
            line2.style.opacity = show === 2 ? "1" : "0";
            WORD_CUTS.forEach((w) => {
              w.el.style.opacity = driver.t >= w.t ? "1" : "0";
            });
          },
        },
        0
      );

      tl.fromTo(
        $("f-11-appel-mark-2"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.34, ease: "power2.out" },
        4.229 + 0.08
      );

      tl.fromTo(
        line2Inner,
        { scale: 1, opacity: 1 },
        {
          scale: 0.62,
          opacity: 0,
          duration: 0.44,
          ease: "power3.in",
          immediateRender: false,
        },
        CLEAR_AT
      );

      tl.fromTo(
        rings,
        { opacity: 0 },
        { opacity: 0.55, duration: 0.7, ease: "power2.out" },
        PILL_AT
      );

      tl.fromTo(
        pillWrap,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.58, ease: "power3.out" },
        PILL_AT
      );
      tl.fromTo(
        glow,
        { opacity: 0, scale: 0.82 },
        { opacity: 0.34, scale: 1.06, duration: 0.42, ease: "power2.out" },
        PILL_AT
      );
      tl.to(
        glow,
        { opacity: 0, scale: 1.52, duration: 0.62, ease: "power2.out" },
        PILL_AT + 0.42
      );

      tl.fromTo(
        wordmark,
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        LOCKUP_AT
      );

      const SUB_BEATS = [7.5, 7.68, 7.84, 8.08, 8.22];
      tl.fromTo(
        $("f-11-appel-sub-vos1"),
        { filter: "blur(8px)", opacity: 0 },
        { filter: "blur(0px)", opacity: 1, duration: 0.4, ease: "power4.out" },
        SUB_BEATS[0]
      );
      tl.fromTo(
        $("f-11-appel-sub-regles"),
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.42, ease: "expo.out" },
        SUB_BEATS[1]
      );
      tl.fromTo(
        $("f-11-appel-sub-dot"),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.36, ease: "power3.out" },
        SUB_BEATS[2]
      );
      tl.fromTo(
        $("f-11-appel-sub-vos2"),
        { x: 28, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "circ.out" },
        SUB_BEATS[3]
      );
      tl.fromTo(
        $("f-11-appel-sub-roles"),
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.44, ease: "power4.out" },
        SUB_BEATS[4]
      );

      const PERIOD = 2.7;
      tl.to(
        cluster,
        {
          y: -2.2,
          duration: PERIOD / 2,
          ease: "sine.inOut",
          yoyo: true,
          repeat: Math.max(0, Math.floor(IDLE_DUR / PERIOD) - 1),
        },
        IDLE_START
      );

      tl.to(
        pillWrap,
        { scale: 0.92, duration: 1.55, ease: "power2.inOut" },
        SETTLE_AT
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["11-appel"] = tl;
    })();
  </script>
