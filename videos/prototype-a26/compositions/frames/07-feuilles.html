  <script>
    (function () {
      const DURATION = 16.091;
      const TILT = 16;
      const TILT_OVER = 8;
      const GLOW_PEAK = 0.3;
      const GLOW_AMP = 0.03;
      const GLOW_SCALE_AMP = 0.016;

      const title = document.getElementById("f-07-feuilles-title");
      const leftPos = document.getElementById("f-07-feuilles-left-pos");
      const rightPos = document.getElementById("f-07-feuilles-right-pos");
      const leftTilt = document.getElementById("f-07-feuilles-left-tilt");
      const rightTilt = document.getElementById("f-07-feuilles-right-tilt");
      const glowA = document.getElementById("f-07-feuilles-glow-a");
      const glowB = document.getElementById("f-07-feuilles-glow-b");
      const badgeSoumis = document.getElementById("f-07-feuilles-badge-soumis");
      const badgeHours = document.getElementById("f-07-feuilles-badge-hours");
      const connector = document.getElementById("f-07-feuilles-connector");
      const bakayoko = document.getElementById("f-07-feuilles-bakayoko");

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        title,
        { y: -46, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.88, ease: "power3.out" },
        0.0,
      );

      tl.fromTo(
        leftPos,
        { x: -300, scale: 0.85, opacity: 0 },
        { x: 0, scale: 1, opacity: 1, duration: 1.05, ease: "power3.out" },
        1.36,
      );
      tl.fromTo(
        leftTilt,
        { rotateY: TILT + TILT_OVER },
        { rotateY: TILT, duration: 1.05, ease: "power3.out" },
        1.36,
      );

      tl.fromTo(
        rightPos,
        { x: 300, scale: 0.85, opacity: 0 },
        { x: 0, scale: 1, opacity: 1, duration: 1.05, ease: "power3.out" },
        1.56,
      );
      tl.fromTo(
        rightTilt,
        { rotateY: -TILT - TILT_OVER },
        { rotateY: -TILT, duration: 1.05, ease: "power3.out" },
        1.56,
      );

      tl.fromTo(
        glowA,
        { opacity: 0, scale: 0.84 },
        { opacity: GLOW_PEAK, scale: 1, duration: 1.1, ease: "power2.out" },
        1.36,
      );
      tl.fromTo(
        glowB,
        { opacity: 0, scale: 0.84 },
        { opacity: GLOW_PEAK, scale: 1, duration: 1.1, ease: "power2.out" },
        1.56,
      );

      const KW_START = 1.585;
      const KW_END = 2.174;
      const ATTACK = 0.16;
      const RELEASE = 0.38;
      const REST = 0.16;
      function keywordEnv(time) {
        if (time < KW_START) return 0;
        if (time < KW_END) return Math.min((time - KW_START) / ATTACK, 1);
        const releaseEnd = KW_END + RELEASE;
        if (time < releaseEnd) return 1 - ((time - KW_END) / RELEASE) * (1 - REST);
        return REST;
      }
      const wordDriver = { t: 0 };
      tl.to(
        wordDriver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            const env = keywordEnv(wordDriver.t);
            bakayoko.style.opacity = String(env);
            bakayoko.style.boxShadow =
              "0 0 " + 30 * env + "px rgba(2, 132, 199, " + 0.55 * env + ")";
            bakayoko.style.transform = "scale(" + (1 + 0.07 * env) + ")";
          },
        },
        0,
      );

      tl.fromTo(
        badgeSoumis,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)" },
        4.43,
      );
      tl.fromTo(
        badgeHours,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)" },
        4.73,
      );

      tl.fromTo(
        connector,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.72, ease: "power3.out" },
        7.05,
      );

      const glowPhase = { p: 0 };
      const GLOW_BREATHE_AT = 2.5;
      const GLOW_BREATHE_DUR = DURATION - GLOW_BREATHE_AT;
      const GLOW_CYCLES = GLOW_BREATHE_DUR / 3.1;
      tl.to(
        glowPhase,
        {
          p: Math.PI * 2 * GLOW_CYCLES,
          duration: GLOW_BREATHE_DUR,
          ease: "none",
          onUpdate: function () {
            const tNorm = glowPhase.p / (Math.PI * 2 * GLOW_CYCLES);
            const env = tNorm < 0.8 ? 1 : (1 - tNorm) / 0.2;
            const sA = Math.sin(glowPhase.p);
            const sB = Math.sin(glowPhase.p + Math.PI);
            gsap.set(glowA, {
              opacity: GLOW_PEAK + sA * GLOW_AMP * env,
              scale: 1 + sA * GLOW_SCALE_AMP * env,
            });
            gsap.set(glowB, {
              opacity: GLOW_PEAK + sB * GLOW_AMP * env,
              scale: 1 + sB * GLOW_SCALE_AMP * env,
            });
          },
        },
        GLOW_BREATHE_AT,
      );

      const idle = { p: 0 };
      const IDLE_AT = 7.05;
      const IDLE_DUR = DURATION - IDLE_AT;
      const IDLE_CYCLES = IDLE_DUR / 3.5;
      const Y_AMP = 2.2;
      tl.to(
        idle,
        {
          p: Math.PI * 2 * IDLE_CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            const tNorm = idle.p / (Math.PI * 2 * IDLE_CYCLES);
            const env = tNorm < 0.8 ? 1 : (1 - tNorm) / 0.2;
            const amp = Y_AMP * env;
            gsap.set(leftPos, { y: Math.sin(idle.p) * amp });
            gsap.set(rightPos, { y: Math.sin(idle.p + Math.PI) * amp });
          },
        },
        IDLE_AT,
      );

      window.__timelines["07-feuilles"] = tl;
    })();
  </script>
